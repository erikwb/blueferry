# Optional documentation site. Every page under docs/ is plain Markdown that
# reads fine on GitHub; this file only adds navigation, search and a theme.
#
#   pip install -r docs/requirements.txt
#   mkdocs build --strict      # writes website/public/docs/
#   mkdocs serve               # preview at http://127.0.0.1:8000/docs/
#
# Kept to core MkDocs and Material options (no third-party plugins) so the
# same file also builds with Zensical, Material's successor.

site_name: BlueFerry
site_description: iPhone messages on Linux over Bluetooth
site_url: https://blueferry.weirdware.io/docs/
repo_url: https://github.com/erikwb/blueferry
repo_name: erikwb/blueferry
edit_uri: edit/main/docs/
copyright: BlueFerry is licensed under GPL-2.0-or-later

docs_dir: docs
site_dir: website/public/docs

exclude_docs: |
  requirements.txt

theme:
  name: material
  language: en
  logo: images/blueferry.svg
  favicon: images/blueferry.svg
  # The landing page's Content-Security-Policy allows only same-origin
  # fonts, so use the self-hosted Adwaita Sans from extra.css instead of
  # Google Fonts.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  alternate:
    - name: English
      link: /docs/en/
      lang: en
    - name: Deutsch
      link: /docs/de/
      lang: de

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  links:
    absolute_links: info
  nav:
    absolute_links: info

