# Fedora installs bluetoothd below /usr/libexec. Exposing the experimental
# interfaces is required for BlueZ's per-transport bearer API. They also load
# BlueZ's own HFP hands-free plugin (5.87 and newer), which takes the iPhone's
# call channel before oFono can; -P hfp leaves it out.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd -E -P hfp
