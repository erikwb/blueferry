# Flatpak manifest — blueferry-ui (the GTK4 desktop app only).
#
# The daemon is deliberately NOT packaged here: it needs privileged setup
# (adapter Class-of-Device via btmgmt and the BLE-bearer configuration) that
# cannot run inside a Flatpak sandbox. Install the daemon natively (see the
# repo README); this Flatpak is the UI, which reaches the native daemon over
# the session bus.
#
# STATUS: draft — not yet built. Pairing currently requires the native client;
# see packaging/flatpak/README.md.

id: io.weirdware.BlueFerry.Gtk
runtime: org.gnome.Platform
runtime-version: '47'   # bump to the current stable GNOME runtime
sdk: org.gnome.Sdk
command: blueferry-ui

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Reach the native BlueFerry daemon — it owns this name on the session bus.
  - --talk-name=io.weirdware.BlueFerry
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  # dbus-python is not in the GNOME runtime. Porting the GTK client to Gio's
  # GDBus API would remove this extra module.
  - name: python3-dbus
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/dbus/dbus-python.git
        tag: dbus-python-1.3.2

  - name: blueferry-ui
    buildsystem: simple
    build-commands:
      # Install the Python package. The UI entry point is blueferry-ui.
      # --no-deps: typer is only used by the CLI, which this Flatpak does not
      # ship; PyGObject + GTK4 + libadwaita come from the GNOME runtime.
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 data/io.weirdware.BlueFerry.Gtk.desktop /app/share/applications/io.weirdware.BlueFerry.Gtk.desktop
      - install -Dm644 data/io.weirdware.BlueFerry.Gtk.metainfo.xml /app/share/metainfo/io.weirdware.BlueFerry.Gtk.metainfo.xml
      - install -Dm644 data/icons/io.weirdware.BlueFerry.Gtk.svg /app/share/icons/hicolor/scalable/apps/io.weirdware.BlueFerry.Gtk.svg
    sources:
      - type: dir
        path: ../..
